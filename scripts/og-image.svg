<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(100,180)">
    <g transform="translate(0, 20)">
      <path d="M50 10 C 20 60, 10 110, 50 180 C 90 110, 80 60, 50 10 Z" fill="url(#leafGrad)"/>
      <path d="M50 30 L 50 170" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="140" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="url(#brand)">Yardvision</text>
    <text x="140" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#d1d5db">Upload a photo of your yard.</text>
    <text x="140" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#d1d5db">Get back an AI-redesigned landscape — in five styles.</text>
  </g>
  <g transform="translate(100, 530)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="500" fill="#34d399">Modern · Zen · Tropical · Mediterranean · Xeriscape</text>
    <text x="0" y="36" font-size="18" font-weight="400" fill="#6b7280">nivedita-yardvision.vercel.app</text>
  </g>
